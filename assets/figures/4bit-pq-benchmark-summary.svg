<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Quick ADC benchmark headline summary</title>
  <desc id="desc">A redrawn benchmark summary showing the paper's headline numbers: roughly three to six times speedup over ADC, and Recall at 100 of 0.94 in 3.4 milliseconds on SIFT1B with 128-bit codes.</desc>
  <defs>
    <style>
      .bg { fill: #fbfcfa; }
      .panel { fill: #ffffff; stroke: #d9dfda; stroke-width: 1.5; }
      .title { font: 700 24px Inter, system-ui, sans-serif; fill: #171a18; }
      .label { font: 700 15px Inter, system-ui, sans-serif; fill: #171a18; }
      .small { font: 12px Inter, system-ui, sans-serif; fill: #69736e; }
      .metric { font: 800 38px Inter, system-ui, sans-serif; fill: #171a18; }
      .axis { stroke: #88938d; stroke-width: 1.3; }
      .adc { fill: #dce7f7; stroke: #315f99; }
      .qadc { fill: #dcebdd; stroke: #2e6b4e; }
      .range { fill: #f4edcf; stroke: #8b6d2f; }
      .note { fill: #f4ded8; stroke: #9f513f; }
    </style>
  </defs>
  <rect class="bg" width="960" height="520" rx="18"/>
  <text class="title" x="40" y="54">Quick ADC paper: headline benchmark</text>
  <text class="small" x="40" y="80">Redrawn summary from the abstract, not a reproduced paper figure.</text>

  <rect class="panel" x="44" y="118" width="424" height="330" rx="14"/>
  <text class="label" x="74" y="154">Reported speedup over ADC</text>
  <text class="small" x="74" y="178">Range depends on dataset and configuration</text>
  <line class="axis" x1="116" y1="388" x2="390" y2="388"/>
  <line class="axis" x1="116" y1="388" x2="116" y2="214"/>
  <rect class="adc" x="160" y="350" width="64" height="38" rx="8"/>
  <text class="label" x="176" y="416">ADC</text>
  <text class="small" x="175" y="342">1x</text>
  <rect class="qadc" x="286" y="160" width="64" height="228" rx="8"/>
  <rect class="range" x="286" y="96" width="64" height="64" rx="8"/>
  <text class="label" x="276" y="416">Quick ADC</text>
  <text class="small" x="288" y="88">up to 6x</text>
  <text class="small" x="292" y="184">3x+</text>

  <rect class="panel" x="500" y="118" width="416" height="156" rx="14"/>
  <text class="label" x="530" y="154">SIFT1B, 128-bit codes</text>
  <text class="metric" x="530" y="208">0.94</text>
  <text class="small" x="632" y="204">Recall@100</text>
  <text class="metric" x="530" y="252">3.4 ms</text>
  <text class="small" x="668" y="248">response time</text>

  <rect class="panel" x="500" y="292" width="416" height="156" rx="14"/>
  <text class="label" x="530" y="328">What the numbers mean here</text>
  <rect class="note" x="530" y="350" width="22" height="22" rx="6"/>
  <text class="small" x="566" y="367">The chart is a compact visual cue for the article.</text>
  <rect class="range" x="530" y="384" width="22" height="22" rx="6"/>
  <text class="small" x="566" y="401">Exact curves and experimental settings remain in the paper.</text>
  <rect class="qadc" x="530" y="418" width="22" height="22" rx="6"/>
  <text class="small" x="566" y="435">The implementation discussion below is about practical tradeoffs.</text>
</svg>
