<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">Row-major versus transposed PQ code layout</title>
  <desc id="desc">A side-by-side diagram showing strided reads before transposition and contiguous block streams after transposition.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#315f99"/>
    </marker>
    <style>
      .bg { fill: #fbfcfa; }
      .panel { fill: #fff; stroke: #d9dfda; stroke-width: 1.5; }
      .title { font: 700 25px Inter, system-ui, sans-serif; fill: #171a18; }
      .label { font: 700 16px Inter, system-ui, sans-serif; fill: #171a18; }
      .body { font: 13px Inter, system-ui, sans-serif; fill: #69736e; }
      .mono { font: 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #171a18; }
      .cell { fill: #eef2ef; stroke: #d9dfda; }
      .bad { fill: #f4ded8; stroke: #9f513f; }
      .good { fill: #dcebdd; stroke: #2e6b4e; }
      .note { fill: #dce7f7; stroke: #315f99; }
      .arrow { fill: none; stroke: #315f99; stroke-width: 2.5; marker-end: url(#arrow); }
      .jump { fill: none; stroke: #9f513f; stroke-width: 2.2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="920" height="460" rx="18"/>
  <text class="title" x="40" y="52">Transposing PQ codes</text>
  <text class="body" x="40" y="78">The block-first loop is fast only when the codes for that block are contiguous.</text>

  <rect class="panel" x="40" y="112" width="365" height="296" rx="14"/>
  <text class="label" x="66" y="148">Before: code[i][j]</text>
  <text class="body" x="66" y="172">Vector-major rows. Same block is strided.</text>
  <g transform="translate(84 216)">
    <text class="mono" x="0" y="-16">vectors</text>
    <text class="mono" x="176" y="-16">blocks</text>
    <rect class="bad" x="0" y="0" width="34" height="28" rx="4"/>
    <rect class="cell" x="42" y="0" width="34" height="28" rx="4"/>
    <rect class="cell" x="84" y="0" width="34" height="28" rx="4"/>
    <rect class="cell" x="126" y="0" width="34" height="28" rx="4"/>
    <rect class="bad" x="0" y="38" width="34" height="28" rx="4"/>
    <rect class="cell" x="42" y="38" width="34" height="28" rx="4"/>
    <rect class="cell" x="84" y="38" width="34" height="28" rx="4"/>
    <rect class="cell" x="126" y="38" width="34" height="28" rx="4"/>
    <rect class="bad" x="0" y="76" width="34" height="28" rx="4"/>
    <rect class="cell" x="42" y="76" width="34" height="28" rx="4"/>
    <rect class="cell" x="84" y="76" width="34" height="28" rx="4"/>
    <rect class="cell" x="126" y="76" width="34" height="28" rx="4"/>
    <rect class="bad" x="0" y="114" width="34" height="28" rx="4"/>
    <rect class="cell" x="42" y="114" width="34" height="28" rx="4"/>
    <rect class="cell" x="84" y="114" width="34" height="28" rx="4"/>
    <rect class="cell" x="126" y="114" width="34" height="28" rx="4"/>
    <path class="jump" d="M17 30v12m0 26v12m0 26v12"/>
  </g>
  <text class="body" x="261" y="262">read block 0</text>
  <text class="body" x="261" y="282">with row jumps</text>
  <rect class="bad" x="260" y="314" width="95" height="30" rx="7"/>
  <text class="body" x="276" y="334">poor locality</text>

  <path class="arrow" d="M425 260h70"/>
  <text class="label" x="435" y="234">transpose</text>

  <rect class="panel" x="515" y="112" width="365" height="296" rx="14"/>
  <text class="label" x="541" y="148">After: code[j][i]</text>
  <text class="body" x="541" y="172">Block-major rows. Same block is sequential.</text>
  <g transform="translate(559 216)">
    <text class="mono" x="0" y="-16">blocks</text>
    <text class="mono" x="176" y="-16">vectors</text>
    <rect class="good" x="0" y="0" width="34" height="28" rx="4"/>
    <rect class="good" x="42" y="0" width="34" height="28" rx="4"/>
    <rect class="good" x="84" y="0" width="34" height="28" rx="4"/>
    <rect class="good" x="126" y="0" width="34" height="28" rx="4"/>
    <rect class="cell" x="0" y="38" width="34" height="28" rx="4"/>
    <rect class="cell" x="42" y="38" width="34" height="28" rx="4"/>
    <rect class="cell" x="84" y="38" width="34" height="28" rx="4"/>
    <rect class="cell" x="126" y="38" width="34" height="28" rx="4"/>
    <rect class="cell" x="0" y="76" width="34" height="28" rx="4"/>
    <rect class="cell" x="42" y="76" width="34" height="28" rx="4"/>
    <rect class="cell" x="84" y="76" width="34" height="28" rx="4"/>
    <rect class="cell" x="126" y="76" width="34" height="28" rx="4"/>
    <rect class="cell" x="0" y="114" width="34" height="28" rx="4"/>
    <rect class="cell" x="42" y="114" width="34" height="28" rx="4"/>
    <rect class="cell" x="84" y="114" width="34" height="28" rx="4"/>
    <rect class="cell" x="126" y="114" width="34" height="28" rx="4"/>
    <path class="arrow" d="M5 14h145"/>
  </g>
  <text class="body" x="735" y="262">read block 0</text>
  <text class="body" x="735" y="282">as one stream</text>
  <rect class="note" x="728" y="314" width="122" height="30" rx="7"/>
  <text class="body" x="751" y="334">cache friendly</text>
</svg>
