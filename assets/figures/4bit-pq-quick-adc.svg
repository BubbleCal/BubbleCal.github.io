<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">Quick ADC SIMD lookup</title>
  <desc id="desc">A diagram of 4-bit codes indexing a 16 byte distance table in a SIMD register, followed by shuffle and accumulation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#315f99"/>
    </marker>
    <style>
      .bg { fill: #fbfcfa; }
      .panel { fill: #fff; stroke: #d9dfda; stroke-width: 1.5; }
      .title { font: 700 25px Inter, system-ui, sans-serif; fill: #171a18; }
      .label { font: 700 16px Inter, system-ui, sans-serif; fill: #171a18; }
      .body { font: 13px Inter, system-ui, sans-serif; fill: #69736e; }
      .mono { font: 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #171a18; }
      .lane { fill: #dce7f7; stroke: #315f99; }
      .code { fill: #f4edcf; stroke: #8b6d2f; }
      .out { fill: #dcebdd; stroke: #2e6b4e; }
      .acc { fill: #f4ded8; stroke: #9f513f; }
      .arrow { fill: none; stroke: #315f99; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="920" height="460" rx="18"/>
  <text class="title" x="40" y="52">Quick ADC: register lookup</text>
  <text class="body" x="40" y="78">4-bit ids pick lanes from a 16-byte distance table, then selected distances are added.</text>

  <rect class="panel" x="50" y="112" width="820" height="96" rx="14"/>
  <text class="label" x="76" y="148">Distance table for one PQ block</text>
  <text class="body" x="76" y="172">16 u8 values fit in one 128-bit register.</text>
  <g transform="translate(358 138)">
    <rect class="lane" x="0" y="0" width="26" height="32" rx="5"/><text class="mono" x="9" y="21">0</text>
    <rect class="lane" x="31" y="0" width="26" height="32" rx="5"/><text class="mono" x="40" y="21">1</text>
    <rect class="lane" x="62" y="0" width="26" height="32" rx="5"/><text class="mono" x="71" y="21">2</text>
    <rect class="lane" x="93" y="0" width="26" height="32" rx="5"/><text class="mono" x="102" y="21">3</text>
    <rect class="lane" x="124" y="0" width="26" height="32" rx="5"/><text class="mono" x="133" y="21">4</text>
    <rect class="lane" x="155" y="0" width="26" height="32" rx="5"/><text class="mono" x="164" y="21">5</text>
    <rect class="lane" x="186" y="0" width="26" height="32" rx="5"/><text class="mono" x="195" y="21">6</text>
    <rect class="lane" x="217" y="0" width="26" height="32" rx="5"/><text class="mono" x="226" y="21">7</text>
    <rect class="lane" x="248" y="0" width="26" height="32" rx="5"/><text class="mono" x="257" y="21">8</text>
    <rect class="lane" x="279" y="0" width="26" height="32" rx="5"/><text class="mono" x="288" y="21">9</text>
    <rect class="lane" x="310" y="0" width="26" height="32" rx="5"/><text class="mono" x="313" y="21">10</text>
    <rect class="lane" x="341" y="0" width="26" height="32" rx="5"/><text class="mono" x="344" y="21">11</text>
    <rect class="lane" x="372" y="0" width="26" height="32" rx="5"/><text class="mono" x="375" y="21">12</text>
    <rect class="lane" x="403" y="0" width="26" height="32" rx="5"/><text class="mono" x="406" y="21">13</text>
    <rect class="lane" x="434" y="0" width="26" height="32" rx="5"/><text class="mono" x="437" y="21">14</text>
    <rect class="lane" x="465" y="0" width="26" height="32" rx="5"/><text class="mono" x="468" y="21">15</text>
  </g>

  <rect class="panel" x="50" y="254" width="250" height="126" rx="14"/>
  <text class="label" x="76" y="290">Packed codes</text>
  <text class="body" x="76" y="314">Each lane is an id in [0, 15].</text>
  <g transform="translate(78 334)">
    <rect class="code" x="0" y="0" width="30" height="28" rx="5"/><text class="mono" x="10" y="19">3</text>
    <rect class="code" x="36" y="0" width="30" height="28" rx="5"/><text class="mono" x="46" y="19">8</text>
    <rect class="code" x="72" y="0" width="30" height="28" rx="5"/><text class="mono" x="78" y="19">12</text>
    <rect class="code" x="108" y="0" width="30" height="28" rx="5"/><text class="mono" x="118" y="19">1</text>
    <rect class="code" x="144" y="0" width="30" height="28" rx="5"/><text class="mono" x="154" y="19">4</text>
    <rect class="code" x="180" y="0" width="30" height="28" rx="5"/><text class="mono" x="190" y="19">7</text>
  </g>

  <path class="arrow" d="M315 317h70"/>

  <rect class="panel" x="400" y="254" width="210" height="126" rx="14"/>
  <text class="label" x="426" y="290">SIMD shuffle</text>
  <text class="body" x="426" y="314">pshufb / tbl selects lanes.</text>
  <rect class="out" x="436" y="334" width="138" height="28" rx="7"/>
  <text class="mono" x="458" y="353">d3 d8 d12 d1...</text>

  <path class="arrow" d="M625 317h70"/>

  <rect class="panel" x="710" y="254" width="160" height="126" rx="14"/>
  <text class="label" x="736" y="290">Accumulate</text>
  <text class="body" x="736" y="314">Add into running</text>
  <text class="body" x="736" y="334">distance sums.</text>
  <rect class="acc" x="736" y="350" width="104" height="28" rx="7"/>
  <text class="mono" x="754" y="369">dist += d</text>

  <path class="arrow" d="M505 216v30"/>
  <text class="body" x="528" y="238">lookup table stays in register</text>
</svg>
