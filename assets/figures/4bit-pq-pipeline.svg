<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Product quantization encoding and ADC lookup pipeline</title>
  <desc id="desc">A vector is split into sub-vectors, each sub-vector is encoded by a local codebook, and query time distance is computed by table lookup and summation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#315f99"/>
    </marker>
    <style>
      .bg { fill: #fbfcfa; }
      .panel { fill: #ffffff; stroke: #d9dfda; stroke-width: 1.5; }
      .title { font: 700 24px Inter, system-ui, sans-serif; fill: #171a18; }
      .label { font: 700 15px Inter, system-ui, sans-serif; fill: #171a18; }
      .small { font: 12px Inter, system-ui, sans-serif; fill: #69736e; }
      .mono { font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #171a18; }
      .arrow { fill: none; stroke: #315f99; stroke-width: 2.5; marker-end: url(#arrow); }
      .green { fill: #dcebdd; stroke: #2e6b4e; }
      .blue { fill: #dce7f7; stroke: #315f99; }
      .rust { fill: #f4ded8; stroke: #9f513f; }
      .gold { fill: #f4edcf; stroke: #8b6d2f; }
      .soft { fill: #eef2ef; stroke: #88938d; }
    </style>
  </defs>
  <rect class="bg" width="960" height="520" rx="18"/>
  <text class="title" x="40" y="54">PQ encoding and ADC lookup</text>
  <text class="small" x="40" y="80">Training compresses vectors into centroid ids; querying turns those ids into distance table lookups.</text>

  <rect class="panel" x="40" y="114" width="210" height="290" rx="14"/>
  <text class="label" x="68" y="150">1. Split vector</text>
  <text class="small" x="68" y="174">D dimensions -> M blocks</text>
  <g transform="translate(68 218)">
    <rect class="green" x="0" y="0" width="36" height="92" rx="8"/>
    <rect class="blue" x="42" y="0" width="36" height="92" rx="8"/>
    <rect class="rust" x="84" y="0" width="36" height="92" rx="8"/>
    <rect class="gold" x="126" y="0" width="36" height="92" rx="8"/>
    <text class="mono" x="7" y="52">x0</text>
    <text class="mono" x="49" y="52">x1</text>
    <text class="mono" x="91" y="52">x2</text>
    <text class="mono" x="133" y="52">x3</text>
  </g>

  <path class="arrow" d="M260 260 C295 260 298 260 328 260"/>

  <rect class="panel" x="330" y="114" width="270" height="290" rx="14"/>
  <text class="label" x="358" y="150">2. Local codebooks</text>
  <text class="small" x="358" y="174">One k-means codebook per block</text>
  <g transform="translate(358 212)">
    <rect class="green" x="0" y="0" width="72" height="28" rx="7"/>
    <rect class="blue" x="0" y="42" width="72" height="28" rx="7"/>
    <rect class="rust" x="0" y="84" width="72" height="28" rx="7"/>
    <rect class="gold" x="0" y="126" width="72" height="28" rx="7"/>
    <text class="mono" x="90" y="19">C0: 0..2^B-1</text>
    <text class="mono" x="90" y="61">C1: 0..2^B-1</text>
    <text class="mono" x="90" y="103">C2: 0..2^B-1</text>
    <text class="mono" x="90" y="145">C3: 0..2^B-1</text>
  </g>

  <path class="arrow" d="M610 260 C642 260 648 260 678 260"/>

  <rect class="panel" x="680" y="114" width="240" height="290" rx="14"/>
  <text class="label" x="708" y="150">3. Code + lookup</text>
  <text class="small" x="708" y="174">Store ids, sum query distances</text>
  <g transform="translate(708 208)">
    <rect class="soft" x="0" y="0" width="168" height="44" rx="10"/>
    <text class="mono" x="14" y="28">code = [3, 12, 4, 8]</text>
    <rect class="blue" x="0" y="78" width="168" height="44" rx="10"/>
    <text class="mono" x="14" y="106">distance_table[q]</text>
    <path class="arrow" d="M84 52 L84 72"/>
    <text class="label" x="0" y="164">ADC distance</text>
    <text class="mono" x="0" y="190">sum dt[j][code[j]]</text>
  </g>
</svg>
