<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>datafusion 源码 Part0</title>
  <script>
    (function () {
      var saved = localStorage.getItem("yah01-blog-language");
      var languages = navigator.languages || [navigator.language || ""];
      var detected = languages.some(function (language) { return /^zh/i.test(language); }) ? "zh" : "en";
      var language = saved === "zh" || saved === "en" ? saved : detected;
      location.replace(language === "zh" ? "/zh/posts/datafusion-source-code-part0/" : "/en/posts/datafusion-source-code-part0/");
    })();
  </script>
  <link rel="stylesheet" href="/assets/site.css">
</head>

  <main class="redirect-choice">
    <h1>Yang Cen</h1>

    <p><a href="/zh/posts/datafusion-source-code-part0/" data-lang-switch data-lang="zh">中文</a> <a href="/en/posts/datafusion-source-code-part0/" data-lang-switch data-lang="en">English</a></p>
  </main>
  <script src="/assets/site.js"></script>
</body>
</html>
